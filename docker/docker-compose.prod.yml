version: "3.9"

# Production overrides — used with:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      - APP_ENV=production
      - LOG_LEVEL=WARNING
    volumes: []          # No source mount in production
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  mongo:
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports: []            # Do not expose MongoDB port in production

  mongo-express:
    profiles:
      - debug            # Only starts if explicitly enabled